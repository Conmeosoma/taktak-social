# ==============================================================================
# Taktak Nginx Reverse Proxy Configuration (Giai đoạn 8B)
# Đường dẫn cài đặt trên VPS: /etc/nginx/sites-available/taktak
# Kích hoạt: sudo ln -sf /etc/nginx/sites-available/taktak /etc/nginx/sites-enabled/
# ==============================================================================

# Định nghĩa các vùng giới hạn tần suất request (Rate Limiting Zones)
# Lưu ý: Nếu include trong server block, các chỉ thị limit_req_zone cần đặt
# trong file /etc/nginx/conf.d/taktak-rate-limit.conf hoặc trong http block của nginx.conf.
# Ở đây cấu hình mẫu đầy đủ:
limit_req_zone $binary_remote_addr zone=taktak_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=taktak_auth:10m rate=5r/m;
limit_req_status 429;

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80) — Certbot ACME Challenge & Redirect sang HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP; # Thay bằng domain thật của bạn (ví dụ: api.taktak.example.com)

    # Thư mục phục vụ xác thực Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Chuyển hướng toàn bộ traffic còn lại sang HTTPS vĩnh viễn (301 Moved Permanently)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443) — TLS Let's Encrypt & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP; # Thay bằng domain thật của bạn

    # --- Cấu hình TLS / SSL (Do Certbot cấp phát) ---
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/privkey.pem;

    # Giao thức & Ciphers an toàn hiện đại
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Headers tăng cường bảo mật
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Giới hạn tải lên & Timeout ---
    # Phù hợp giới hạn backend: Spring Boot cho phép 5MB/file, 6MB multipart request
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # --- Nhật ký truy cập (Logs) ---
    access_log /var/log/nginx/taktak_access.log;
    error_log /var/log/nginx/taktak_error.log warn;

    # --- BẢO VỆ DỮ LIỆU RIÊNG TƯ ---
    # TUYỆT ĐỐI KHÔNG cấu hình location alias/root trỏ tới /var/taktak/private-images
    # Mọi yêu cầu tải ảnh khoảnh khắc BẮT BUỘC phải đi qua API Spring Boot để xác thực JWT và quan hệ bạn bè.
    
    # Chặn toàn bộ file ẩn / dotfiles (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Endpoint Đăng nhập & Đăng ký (Rate limit nghiêm ngặt chống Brute-force) ---
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=taktak_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Các API thông thường (/api/...) ---
    location /api/ {
        limit_req zone=taktak_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Healthcheck Endpoint ---
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off; # Giảm tải log cho healthcheck định kỳ
    }

    # --- Root fallback ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
