spring:
  application:
    name: taktak-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  tomcat:
    # 100 người nhận + ảnh/caption; vẫn giới hạn multipart hữu hạn.
    max-part-count: 104
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# Secret JWT bắt buộc hợp lệ khi khởi động; không có khóa dev mặc định.
taktak:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  storage:
    root: ${IMAGE_STORAGE_ROOT:./.local/private-images}
  fcm:
    enabled: false
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
