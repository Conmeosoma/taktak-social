spring:
  application:
    name: taktak-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# Chỉ giữ tên cấu hình cho bước sau, chưa tạo auth/storage/FCM service.
taktak:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  storage:
    root: ${IMAGE_STORAGE_ROOT:./.local/private-images}
  fcm:
    enabled: false
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
